<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GroupDrop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0f0f13;
      --surface:  #18181f;
      --panel:    #1e1e28;
      --border:   #2a2a38;
      --accent:   #7c6ef5;
      --accent2:  #b06ef5;
      --text:     #e8e8f0;
      --muted:    #7070a0;
      --mine-bg:  #312e60;
      --their-bg: #1e1e28;
      --radius:   14px;
      --font:     'Inter', system-ui, sans-serif;
    }
    html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }

    /* ── Login ── */
    #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; }
    #login-screen.hidden { display:none; }
    .logo { font-size:2rem; font-weight:600; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; }
    .tagline { color:var(--muted); font-size:.9rem; margin-bottom:20px; }
    .login-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px; width:min(380px,90vw); display:flex; flex-direction:column; gap:12px; }
    .login-card label { font-size:.8rem; color:var(--muted); }
    .btn-primary { padding:10px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:8px; color:#fff; font-family:var(--font); font-size:.95rem; font-weight:600; cursor:pointer; transition:opacity .15s; }
    .btn-primary:hover { opacity:.88; }

    /* ── Setup warning ── */
    #setup-warn { background:#1a1200; border:1px solid #5a3a00; border-radius:10px; padding:14px 16px; font-size:.82rem; color:#fbbf24; line-height:1.6; }
    #setup-warn code { background:#2a2000; padding:1px 5px; border-radius:4px; }
    #setup-warn.hidden { display:none; }

    /* ── Chat ── */
    #chat-screen { display:flex; flex-direction:column; height:100vh; }
    #chat-screen.hidden { display:none; }
    header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; align-items:center; gap:12px; }
    .header-logo { font-weight:600; font-size:1.1rem; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .header-sep { flex:1; }
    .user-pill { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:5px 12px; font-size:.85rem; }
    .dot { width:8px; height:8px; background:#4ade80; border-radius:50%; }
    #change-name { background:none; border:none; color:var(--muted); font-size:.75rem; cursor:pointer; padding:2px 6px; border-radius:4px; }
    #change-name:hover { color:var(--text); }

    /* ── Feed ── */
    #feed { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:10px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .empty { text-align:center; color:var(--muted); margin-top:60px; font-size:.95rem; }
    .bubble-wrap { display:flex; flex-direction:column; max-width:min(520px,78vw); }
    .bubble-wrap.mine { align-self:flex-end; align-items:flex-end; }
    .bubble-wrap.theirs { align-self:flex-start; align-items:flex-start; }
    .meta { font-size:.72rem; color:var(--muted); margin-bottom:3px; padding:0 4px; }
    .bubble { padding:10px 14px; border-radius:14px; font-size:.95rem; line-height:1.45; word-break:break-word; }
    .mine .bubble { background:var(--mine-bg); border-bottom-right-radius:4px; }
    .theirs .bubble { background:var(--their-bg); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .time { font-size:.65rem; color:var(--muted); margin-top:3px; padding:0 4px; }
    .media-img { max-width:100%; max-height:300px; border-radius:10px; cursor:zoom-in; display:block; }
    .media-img:hover { opacity:.9; }

    /* ── Drop zone ── */
    #drop-zone { margin:0 16px; border:1.5px dashed var(--border); border-radius:10px; padding:10px 16px; text-align:center; color:var(--muted); font-size:.82rem; cursor:pointer; transition:border-color .15s, background .15s; }
    #drop-zone:hover, #drop-zone.drag-over { border-color:var(--accent); background:rgba(124,110,245,.06); color:var(--accent); }

    /* ── Progress ── */
    #progress-wrap { margin:8px 16px 0; }
    #progress-wrap.hidden { display:none; }
    #progress-label { font-size:.75rem; color:var(--muted); margin-bottom:4px; }
    .progress-track { height:4px; background:var(--border); border-radius:4px; overflow:hidden; }
    #progress-bar { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s; }

    /* ── Input ── */
    .input-row { display:flex; align-items:flex-end; gap:8px; padding:12px 16px 16px; background:var(--surface); border-top:1px solid var(--border); }
    textarea#text-input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:var(--font); font-size:.95rem; padding:10px 14px; resize:none; min-height:42px; max-height:140px; outline:none; transition:border-color .15s; line-height:1.4; }
    textarea#text-input:focus { border-color:var(--accent); }
    textarea#text-input::placeholder { color:var(--muted); }
    #send-btn { width:42px; height:42px; border-radius:10px; border:none; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:opacity .15s; }
    #send-btn:hover { opacity:.88; }
    #send-btn svg { width:18px; height:18px; }
    input[type="file"] { display:none; }

    input[type="text"] { width:100%; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--font); font-size:1rem; outline:none; transition:border-color .15s; }
    input[type="text"]:focus { border-color:var(--accent); }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     CONFIGURATION — fill these two values in, then save.

     BOT_TOKEN  → from @BotFather on Telegram
     CHAT_ID    → your group's chat ID (negative number like -1001234567890)

     HOW TO GET YOUR CHAT ID:
       1. Add your bot to your Telegram group
       2. Send any message in the group
       3. Open this URL in your browser (replace YOUR_BOT_TOKEN):
          https://api.telegram.org/botYOUR_BOT_TOKEN/getUpdates
       4. Look for "chat":{"id": -XXXXXXXXXX}  ← that number is your CHAT_ID
════════════════════════════════════════════════════════════════ -->
<script>
  const BOT_TOKEN = "YOUR_BOT_TOKEN";
  const CHAT_ID   = "YOUR_CHAT_ID";
</script>
<!-- ══════════════════════════════════════════════════════════ -->

<!-- Login -->
<div id="login-screen">
  <div class="logo">GroupDrop</div>
  <div class="tagline">One link. Everyone in.</div>

  <div id="setup-warn" class="hidden">
    ⚠️ <strong>Not configured yet.</strong> Open <code>index.html</code> in a text editor and fill in your <code>BOT_TOKEN</code> and <code>CHAT_ID</code> at the top of the file.
  </div>

  <div class="login-card">
    <label for="name-input">Your name</label>
    <input type="text" id="name-input" placeholder="e.g. Alex" maxlength="32" autocomplete="off"/>
    <button class="btn-primary" id="join-btn">Join the chat →</button>
  </div>
</div>

<!-- Chat -->
<div id="chat-screen" class="hidden">
  <header>
    <span class="header-logo">GroupDrop</span>
    <span class="header-sep"></span>
    <div class="user-pill">
      <span class="dot"></span>
      <span id="display-name"></span>
      <button id="change-name">change</button>
    </div>
  </header>

  <div id="feed"><div class="empty">Loading messages…</div></div>

  <label id="drop-zone" for="file-input">
    📎 Drop images here, or click to pick from your PC
  </label>
  <input type="file" id="file-input" accept="image/*" multiple/>

  <div id="progress-wrap" class="hidden">
    <div id="progress-label"></div>
    <div class="progress-track"><div id="progress-bar"></div></div>
  </div>

  <div class="input-row">
    <textarea id="text-input" placeholder="Say something…" rows="1"></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const API = `https://api.telegram.org/bot${BOT_TOKEN}`;
  const configured = BOT_TOKEN !== "8571459124:AAH5F8TMr-0FcSuBf7y3NnqNPtl00hhqzzY" && CHAT_ID !== "-5553025330";

  let username  = localStorage.getItem("gd_username") || "";
  let offset    = parseInt(localStorage.getItem("gd_offset") || "0");
  let msgCache  = JSON.parse(localStorage.getItem("gd_msgs") || "[]");
  let pollTimer = null;

  // ── DOM ──────────────────────────────────────────────────
  const loginScreen   = document.getElementById("login-screen");
  const chatScreen    = document.getElementById("chat-screen");
  const nameInput     = document.getElementById("name-input");
  const joinBtn       = document.getElementById("join-btn");
  const feed          = document.getElementById("feed");
  const textInput     = document.getElementById("text-input");
  const sendBtn       = document.getElementById("send-btn");
  const fileInput     = document.getElementById("file-input");
  const dropZone      = document.getElementById("drop-zone");
  const progressWrap  = document.getElementById("progress-wrap");
  const progressBar   = document.getElementById("progress-bar");
  const progressLabel = document.getElementById("progress-label");
  const displayName   = document.getElementById("display-name");
  const changeNameBtn = document.getElementById("change-name");
  const setupWarn     = document.getElementById("setup-warn");

  // ── Init ─────────────────────────────────────────────────
  if (!configured) setupWarn.classList.remove("hidden");
  if (username) showChat();

  joinBtn.addEventListener("click", () => {
    const v = nameInput.value.trim();
    if (!v) return nameInput.focus();
    username = v;
    localStorage.setItem("gd_username", username);
    showChat();
  });
  nameInput.addEventListener("keydown", e => e.key === "Enter" && joinBtn.click());

  changeNameBtn.addEventListener("click", () => {
    clearInterval(pollTimer);
    loginScreen.classList.remove("hidden");
    chatScreen.classList.add("hidden");
    nameInput.value = username;
  });

  function showChat() {
    loginScreen.classList.add("hidden");
    chatScreen.classList.remove("hidden");
    displayName.textContent = username;
    renderAll();
    if (configured) startPolling();
  }

  // ── Polling ───────────────────────────────────────────────
  async function startPolling() {
    await fetchUpdates();
    pollTimer = setInterval(fetchUpdates, 3000);
  }

  async function fetchUpdates() {
    try {
      const res  = await fetch(`${API}/getUpdates?offset=${offset}&limit=100&timeout=0`);
      const data = await res.json();
      if (!data.ok || !data.result.length) return;

      let changed = false;
      for (const update of data.result) {
        offset = update.update_id + 1;
        localStorage.setItem("gd_offset", offset);

        const msg = update.message || update.channel_post;
        if (!msg) continue;
        if (String(msg.chat.id) !== String(CHAT_ID)) continue;

        const parsed = parseMsg(msg);
        if (!parsed) continue;

        // avoid duplicates
        if (!msgCache.find(m => m.id === parsed.id)) {
          msgCache.push(parsed);
          changed = true;
        }
      }

      if (changed) {
        localStorage.setItem("gd_msgs", JSON.stringify(msgCache.slice(-500)));
        renderAll();
      }
    } catch(e) {
      console.warn("Poll error", e);
    }
  }

  // ── Parse a Telegram message ──────────────────────────────
  function parseMsg(msg) {
    if (msg.text) {
      // format: "[Name]: message text"
      const match = msg.text.match(/^\[(.+?)\]: ([\s\S]+)$/);
      if (!match) return null;
      return { id: msg.message_id, type:"text", sender: match[1], text: match[2], ts: msg.date * 1000 };
    }
    if (msg.photo) {
      const caption = msg.caption || "";
      const match   = caption.match(/^\[(.+?)\]/);
      const sender  = match ? match[1] : "Someone";
      const fileId  = msg.photo[msg.photo.length - 1].file_id;
      return { id: msg.message_id, type:"photo", sender, fileId, ts: msg.date * 1000 };
    }
    return null;
  }

  // ── Render ────────────────────────────────────────────────
  function renderAll() {
    feed.innerHTML = "";
    if (!msgCache.length) {
      feed.innerHTML = `<div class="empty">No messages yet. Say something 👋</div>`;
      return;
    }
    msgCache.forEach(msg => feed.appendChild(buildBubble(msg)));
    feed.scrollTop = feed.scrollHeight;
  }

  function buildBubble(msg) {
    const isMine = msg.sender === username;
    const wrap   = document.createElement("div");
    wrap.className = `bubble-wrap ${isMine ? "mine" : "theirs"}`;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = isMine ? "You" : msg.sender;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (msg.type === "text") {
      bubble.textContent = msg.text;
    } else if (msg.type === "photo") {
      if (msg.url) {
        const img = document.createElement("img");
        img.src = msg.url;
        img.className = "media-img";
        img.onclick = () => window.open(msg.url, "_blank");
        bubble.appendChild(img);
      } else {
        // fetch url from Telegram and cache it
        bubble.innerHTML = `<span style="color:var(--muted);font-size:.85rem">Loading image…</span>`;
        resolvePhoto(msg.fileId).then(url => {
          if (url) {
            msg.url = url;
            localStorage.setItem("gd_msgs", JSON.stringify(msgCache.slice(-500)));
            const img = document.createElement("img");
            img.src = url;
            img.className = "media-img";
            img.onclick = () => window.open(url, "_blank");
            bubble.innerHTML = "";
            bubble.appendChild(img);
          }
        });
      }
    }

    const time = document.createElement("div");
    time.className = "time";
    if (msg.ts) {
      time.textContent = new Date(msg.ts).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
    }

    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    wrap.appendChild(time);
    return wrap;
  }

  async function resolvePhoto(fileId) {
    try {
      const res  = await fetch(`${API}/getFile?file_id=${fileId}`);
      const data = await res.json();
      if (!data.ok) return null;
      return `https://api.telegram.org/file/bot${BOT_TOKEN}/${data.result.file_path}`;
    } catch { return null; }
  }

  // ── Send text ─────────────────────────────────────────────
  sendBtn.addEventListener("click", sendText);
  textInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); }
  });

  async function sendText() {
    const text = textInput.value.trim();
    if (!text || !configured) return;
    textInput.value = "";
    await fetch(`${API}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: `[${username}]: ${text}` })
    });
    await fetchUpdates();
  }

  // ── Send image ────────────────────────────────────────────
  fileInput.addEventListener("change", e => [...e.target.files].forEach(uploadImage));
  dropZone.addEventListener("dragover",  e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    [...e.dataTransfer.files].forEach(uploadImage);
  });

  async function uploadImage(file) {
    if (!file.type.startsWith("image/")) {
      alert("Only images are supported.");
      return;
    }
    if (!configured) return;

    progressWrap.classList.remove("hidden");
    progressLabel.textContent = `Uploading ${file.name}…`;
    progressBar.style.width = "30%";

    const form = new FormData();
    form.append("chat_id", CHAT_ID);
    form.append("photo", file);
    form.append("caption", `[${username}]`);

    try {
      progressBar.style.width = "70%";
      await fetch(`${API}/sendPhoto`, { method:"POST", body: form });
      progressBar.style.width = "100%";
      setTimeout(() => {
        progressWrap.classList.add("hidden");
        progressBar.style.width = "0%";
      }, 400);
      await fetchUpdates();
    } catch(e) {
      progressWrap.classList.add("hidden");
      alert("Upload failed: " + e.message);
    }
  }

  // ── Auto-resize textarea ──────────────────────────────────
  textInput.addEventListener("input", () => {
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 140) + "px";
  });
</script>
</body>
</html>
